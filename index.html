<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de PDF Acadêmico</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">

    <div class="max-w-3xl mx-auto px-4 py-10">
        <header class="text-center mb-8">
            <h1 class="text-3xl font-bold text-gray-900">Criador de PDF</h1>
            <p class="text-gray-600 mt-2">Cole seu texto abaixo para gerar um documento formatado.</p>
        </header>

        <main class="bg-white rounded-2xl shadow-sm border border-gray-200 p-6">
            <!-- Título do Arquivo -->
            <div class="mb-4">
                <label for="fileName" class="block text-sm font-semibold text-gray-700 mb-1">Nome do Arquivo (PDF):</label>
                <input type="text" id="fileName" value="Atividade_Filosofia" 
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
            </div>

            <!-- Área de Texto -->
            <div class="mb-6">
                <label for="textContent" class="block text-sm font-semibold text-gray-700 mb-1">Conteúdo do Documento:</label>
                <textarea id="textContent" rows="15" 
                    class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none text-gray-700 leading-relaxed"
                    placeholder="Cole aqui o texto transcrevido..."></textarea>
            </div>

            <!-- Ações -->
            <div class="flex flex-col sm:flex-row gap-4">
                <button id="generateBtn" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-6 rounded-xl transition flex justify-center items-center gap-2">
                    <i class="fas fa-file-pdf"></i> Gerar e Baixar PDF
                </button>
                <button id="clearBtn" class="bg-gray-100 hover:bg-gray-200 text-gray-700 font-semibold py-3 px-6 rounded-xl transition">
                    Limpar Tudo
                </button>
            </div>
        </main>

        <footer class="text-center mt-8 text-sm text-gray-400">
            Ferramenta offline rápida para conversão de texto em PDF.
        </footer>
    </div>

    <script>
        const { jsPDF } = window.jspdf;

        const generateBtn = document.getElementById('generateBtn');
        const clearBtn = document.getElementById('clearBtn');
        const textContent = document.getElementById('textContent');
        const fileNameInput = document.getElementById('fileName');

        // Função para gerar o PDF
        generateBtn.onclick = () => {
            const text = textContent.value.trim();
            const fileName = fileNameInput.value.trim() || 'documento';

            if (!text) {
                alert('Por favor, insira algum texto antes de gerar o PDF.');
                return;
            }

            const doc = new jsPDF({
                orientation: 'portrait',
                unit: 'mm',
                format: 'a4'
            });

            // Configurações de página
            const pageWidth = doc.internal.pageSize.getWidth();
            const margin = 20;
            const maxLineWidth = pageWidth - (margin * 2);

            // Adicionar conteúdo
            doc.setFont("helvetica", "normal");
            doc.setFontSize(12);

            // Divide o texto para caber na largura da página
            const splitText = doc.splitTextToSize(text, maxLineWidth);
            
            // Adiciona o texto com margens superiores
            doc.text(splitText, margin, 25);

            // Salva o arquivo
            doc.save(`${fileName}.pdf`);
        };

        // Função para limpar campos
        clearBtn.onclick = () => {
            if(confirm('Tem certeza que deseja limpar todo o conteúdo?')) {
                textContent.value = '';
            }
        };
    </script>
</body>
</html>
